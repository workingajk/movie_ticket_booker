<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="./js/common.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./css/theme.css">


    <!-- fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


</head>

<body>



    <!-- Backdrop -->
    <div id="backdrop" class="fixed inset-0 bg-black/50 hidden z-40">
    </div>

    <div class="flex">

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:static top-0 left-0 z-50
        h-screen w-64 bg-blue-300
        -translate-x-full md:translate-x-0
        transition-transform duration-300">

            <button id="closeBtn" class="md:hidden p-3">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <nav class="p-4 flex flex-col justify-between h-full">
                <div class="flex flex-col gap-2">
                    <h1 class="text-4xl flex justify-center items-center font-bold pb-4"> <img
                            src="./img/common/event-ticket.png" class="h-13 invert" alt="" srcset=""> CineGo</h1>
                    <a href="./index.html">
                        <p class=" rounded-xl text-xl py-2 px-4"> <i class="fa-solid fa-chart-pie"></i> Dashboard</p>
                    </a>
                    <a href="./movies.html">
                        <p class=" rounded-xl text-xl py-2 px-4"> <i class="fa-solid fa-clapperboard"></i> Movies</p>
                    </a>
                    <a href="./theaters.html">
                        <p class="rounded-xl text-xl py-2 px-4"> <i class="fa-solid fa-masks-theater"></i> Theaters</p>
                    </a>
                    <a href="./shows.html">
                        <p class="rounded-xl text-xl py-2 px-4"> <i class="fa-solid fa-calendar-days"></i> Shows</p>
                    </a>
                    <a href="./booking.html">
                        <p class=" rounded-xl text-xl py-2 px-4"> <i class="fa-solid fa-receipt"></i> Bookings</p>
                    </a>
                    <a href="./users.html">
                        <p class=" rounded-xl text-xl py-2 px-4"> <i class="fa-solid fa-user-group"></i> Users</p>
                    </a>
                </div>
                <a href="./settings.html">
                    <p class="bg-gray-100  rounded-xl text-xl py-2 px-4"> <i class="fa-solid fa-gear"></i> Settings</p>
                </a>
            </nav>

        </aside>

        <!-- Main content -->
        <main class="flex-1 h-screen flex flex-col overflow-y-auto scrollbar-none">
            <!-- Mobile menu button -->
            <div class="flex items-center justify-between h-12 bg-blue-200 sticky top-0 z-30">


                <button id="menuBtn" class="md:hidden p-3 bg-blue-200 text-white">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div class="relative w-full max-w-[390px] hidden sm:block ml-4">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">⌕</span>
                    <input
                        class="focus:border-blue-400 focus:ring-2 focus:ring-blue-100 w-full bg-gray-50 border border-gray-100 rounded-xl py-1 pl-10 pr-4 text-sm"
                        placeholder="Search bookings, customers...">
                </div>
                <div class="flex justify-center items-center lg:hidden ">
                    <!-- <span class="font-bold text-[#172554]">CineGo</span> -->
                    <h1 class="text-xl flex justify-center items-center  font-semibold "> <img
                            src="./img/common/event-ticket.png" class="h-7" alt="" srcset=""> CineGo</h1>
                </div>
                <img src="./img/index/profile.jpg" class="h-10 my-1 mx-4 aspect-4/3 object-cover rounded-full w-10"
                    alt="">
            </div>
            <div class="flex-1 scrollbar-none p-4">
                <div class="bg-white rounded-xl shadow-sm p-5 mt-6">

                    <h2 class="text-lg font-semibold text-gray-800 mb-4 max-w-4xl">
                        Admin Profile
                    </h2>
                    <div class="flex items-center gap-4 mb-6">

                        <div class="w-16 h-16 rounded-full bg-blue-100 flex items-center justify-center">
                            <i class="fa-solid fa-user text-2xl text-blue-500"></i>
                        </div>

                        <div>
                            <h3 class="font-medium text-gray-800">
                                Admin
                            </h3>

                            <p class="text-sm text-gray-500">
                                Profile Information
                            </p>
                            <button type="button" class="text-sm text-blue-600 hover:text-blue-700 font-medium">
                                Change Avatar
                            </button>
                        </div>

                    </div>


                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-4xl">

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                Full Name
                            </label>

                            <input type="text" placeholder="Enter your name" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-400">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                Email Address
                            </label>

                            <input type="email" placeholder="Enter your email" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-400">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                Phone Number
                            </label>

                            <input type="tel" placeholder="Enter your phone number" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-400">
                        </div>

                    </div>
                    <button type="button" class="mt-6 bg-blue-500 hover:bg-blue-600 text-white font-medium px-5 py-2.5 rounded-lg transition">
                        Update Profile
                    </button>


                </div>

                <div class="bg-white rounded-xl shadow-sm p-5 mt-6 w-full">

                    <h2 class="text-lg font-semibold text-gray-800 mb-4">
                        security option
                    </h2>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                Current Password
                            </label>

                            <input type="password" placeholder="Enter current password" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-400">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                New Password
                            </label>

                            <input type="password" placeholder="Enter new password" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-400">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                Confirm Password
                            </label>

                            <input type="password" placeholder="Confirm new password" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-400">
                        </div>

                    </div>

                    <button type="button" class="mt-6 bg-blue-500 hover:bg-blue-600 text-white font-medium px-5 py-2.5 rounded-lg transition">
                        Change Password
                    </button>

                </div>

                <div class="bg-white rounded-xl shadow-sm p-5 mt-6 w-full">

                    <h2 class="text-lg font-semibold text-gray-800 mb-4">
                        System Preferences
                    </h2>

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            Language
                        </label>

                        <select class="w-full border border-gray-300 rounded-lg px-3 py-2">
                            <option>English</option>
                            <option>Malayalam</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-3">
                        <input type="checkbox" class="w-4 h-4 accent-blue-500">

                        <label class="text-sm font-medium text-gray-700">
                            Enable Notifications
                        </label>
                    </div>

                </div>
                <div class="flex gap-3 mt-6 max-w-4xl">

                    <button type="button" class="bg-blue-500 text-white px-5 py-2.5 rounded-lg hover:bg-blue-600">
                        Save All Changes
                    </button>

                    <button type="button"
                        class="border border-gray-300 text-gray-700 px-5 py-2.5 rounded-lg hover:bg-gray-100">
                        Cancel
                    </button>

                </div>

            </div>


        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>

</body>

</html>
